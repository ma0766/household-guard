<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui,sans-serif" font-size="14">
  <rect width="960" height="520" fill="#f6f4ef"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1d2433">Household Guard — every action passes one set of house rules</text>
  <g fill="#fff" stroke="#1d2433" stroke-width="1.5">
    <rect x="24" y="70" width="150" height="70" rx="10"/><rect x="24" y="170" width="150" height="70" rx="10"/><rect x="24" y="270" width="150" height="70" rx="10"/>
    <rect x="230" y="70" width="190" height="270" rx="10"/>
    <rect x="480" y="70" width="210" height="60" rx="10"/><rect x="480" y="150" width="210" height="60" rx="10"/><rect x="480" y="230" width="210" height="60" rx="10"/><rect x="480" y="310" width="210" height="60" rx="10"/>
    <rect x="740" y="70" width="190" height="60" rx="10"/><rect x="740" y="150" width="190" height="60" rx="10"/><rect x="740" y="230" width="190" height="60" rx="10"/>
    <rect x="230" y="400" width="460" height="80" rx="10"/>
  </g>
  <g fill="#1d2433">
    <text x="40" y="100">Alexa+ / web client</text><text x="40" y="120" font-size="12">8 fixed tools (MCP)</text>
    <text x="40" y="200">Phones (one each)</text><text x="40" y="220" font-size="12">tap the number Alexa said</text>
    <text x="40" y="300">Adult approval</text><text x="40" y="320" font-size="12">on their own phone</text>
    <text x="246" y="100" font-weight="700">AWS Lambda + Function URL</text>
    <text x="246" y="124" font-size="12">1 who is speaking (confirmed</text><text x="246" y="140" font-size="12">   by phone tap or PIN)</text>
    <text x="246" y="164" font-size="12">2 Cedar: auto rules → approvable</text><text x="246" y="180" font-size="12">   rules → else deny</text>
    <text x="246" y="204" font-size="12">3 reserve money (conditional write)</text>
    <text x="246" y="228" font-size="12">4 reply in under 500 ms + job id</text>
    <text x="246" y="252" font-size="12">5 hash-chained audit entry</text>
    <text x="246" y="290" font-size="12">Forbid always beats permit.</text><text x="246" y="306" font-size="12">Errors → hold or deny, never allow.</text>
    <text x="496" y="96" font-weight="700">Amazon DynamoDB</text><text x="496" y="114" font-size="12">people, rules, spend, approvals, audit</text>
    <text x="496" y="176" font-weight="700">Amazon SQS</text><text x="496" y="194" font-size="12">slow work leaves the reply path</text>
    <text x="496" y="256" font-weight="700">Worker Lambda</text><text x="496" y="274" font-size="12">re-quote → risk check → book → commit</text>
    <text x="496" y="336" font-weight="700">Amazon Bedrock (Claude Haiku)</text><text x="496" y="354" font-size="12">can only turn "do it" into "hold"</text>
    <text x="756" y="96" font-weight="700">Mock ride + shop</text><text x="756" y="114" font-size="12">quotes include fees</text>
    <text x="756" y="176" font-weight="700">Simulated home</text><text x="756" y="194" font-size="12">lights, door, heat, garage</text>
    <text x="756" y="256" font-weight="700">Replies are data</text><text x="756" y="274" font-size="12">never read as a decision</text>
    <text x="246" y="430" font-weight="700">Guarantees</text>
    <text x="246" y="452" font-size="12">no person argument · approvals bound to exact item + price, expire in 10 minutes</text>
    <text x="246" y="470" font-size="12">cap enforced in the database · retries book once · every change is logged and undoable</text>
  </g>
  <g stroke="#1b6b57" stroke-width="2" fill="none"><path d="M174 105H230"/><path d="M174 205H230"/><path d="M174 305H230"/><path d="M420 100H480"/><path d="M420 180H480"/><path d="M420 260H480"/><path d="M690 260H740"/><path d="M690 340H600"/><path d="M690 180H740"/><path d="M690 100H740"/></g>
</svg>
