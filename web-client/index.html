<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Household Guard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header><h1>Household Guard</h1><p class="sub">One set of house rules for everyone at home.</p></header>
  <main>
    <section id="speaker-panel" aria-label="Alexa">
      <h2>Alexa</h2>
      <p class="hint">Who is talking?</p>
      <div class="row" id="speakers"></div>
      <div class="row">
        <input id="say" data-testid="say" placeholder="Say something…" aria-label="What did they say" />
        <button id="btn-say" data-testid="btn-say">Send</button>
        <button id="btn-talk" class="secondary" title="Use your voice (Chrome)">🎤 Talk</button>
      </div>
      <div class="row" id="quick"></div>
      <div id="alexa-says" data-testid="alexa-says" class="says" aria-live="polite">Alexa is listening.</div>
    </section>
    <section id="phones-panel" aria-label="Phones">
      <h2>Phones</h2>
      <div id="phones" class="phones"></div>
    </section>
    <section id="conn-panel" aria-label="Ride service">
      <h2>Ride service</h2>
      <p id="conn-status" data-testid="conn-status" aria-live="polite">The ride service works.</p>
      <div class="row">
        <button id="btn-break-ride" class="secondary" data-testid="btn-break-ride" title="Demo: the service ships a new version">Break it (demo)</button>
        <button id="btn-check-rides" data-testid="btn-check-rides">Check now</button>
      </div>
    </section>
    <section id="app-panel" aria-label="Screen from the house">
      <h2>Screen</h2>
      <div class="row">
        <button id="btn-app-approvals" data-testid="btn-app-approvals">Show what is waiting</button>
        <button id="btn-app-orders" class="secondary" data-testid="btn-app-orders">Show recent buys</button>
      </div>
      <iframe id="app-frame" data-testid="app-frame" sandbox="allow-scripts" title="Screen from the house" style="width:100%;height:260px;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe>
    </section>
    <section id="timeline-panel" aria-label="What happened">
      <h2>What happened</h2>
      <div class="row">
        <select id="tl-person" data-testid="tl-person" aria-label="Show whose"><option value="">Everyone</option><option value="mom">Mom</option><option value="maya">Maya</option><option value="leo">Leo</option></select>
        <select id="tl-day" data-testid="tl-day" aria-label="Which day"><option value="">All days</option><option value="today">Today</option></select>
        <button id="btn-voice-summary" class="secondary" data-testid="btn-kids-week">What did the kids buy this week?</button>
      </div>
      <iframe id="timeline" data-testid="timeline" sandbox="" title="What happened" style="width:100%;height:420px;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe>
      <p id="summary" data-testid="summary" class="says" hidden></p>
    </section>
    <section id="rules-panel" aria-label="House rules">
      <h2>House rules</h2>
      <p class="hint">Adults can change these. Kids can only look.</p>
      <div class="row">
        <label for="rule-maya-limit">Maya's limit ($ a week)</label>
        <input id="rule-maya-limit" data-testid="rule-maya-limit" inputmode="numeric" value="20" style="max-width:80px" />
        <button id="rule-save-maya" data-testid="rule-save-maya">Save</button>
        <button id="rule-quiet-on" class="secondary" data-testid="rule-quiet-on">No buying after 9 PM</button>
        <button id="rule-quiet-off" class="secondary" data-testid="rule-quiet-off">Quiet hours off</button>
        <button id="rule-undo" data-testid="rule-undo" class="secondary">Undo last change</button>
      </div>
      <p id="rule-preview" data-testid="rule-preview" class="hint" aria-live="polite"></p>
      <iframe id="rules-frame" data-testid="rules-frame" sandbox="" title="House rules" style="width:100%;height:300px;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe>
    </section>
    <section id="log-panel" aria-label="Message log">
      <h2>Message log</h2>
      <div class="row">
        <button id="btn-connect" class="secondary">Connect</button>
        <button id="btn-tools" class="secondary">List tools</button>
        <button id="btn-status" class="secondary">Ask: house status</button>
      </div>
      <pre id="log" data-testid="log"></pre>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
